build_prod:
  stage: build-prod
  before_script:
    - chmod +x setup_prod_env.sh
    - ./setup_prod_env.sh
    - docker build -t ${SUPERVISOR_IMAGE} --file supervisord.Dockerfile .
  script:
    - docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN}
    - docker push ${SUPERVISOR_IMAGE}
  after_script:
    - docker image rm -f ${SUPERVISOR_IMAGE} || true
  tags:
    - php-shell
  only:
    - release

