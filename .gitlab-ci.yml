stages:
  - prepare
  # - build-stage
  - build-prod
  - publish

variables:
  SUPERVISOR_IMAGE: $CI_REGISTRY_IMAGE:supervisord-$CI_COMMIT_REF_SLUG

composer_install:
  stage: prepare
  script:
    - composer install --ignore-platform-reqs --no-scripts
  artifacts:
    paths:
      - vendor/
    expire_in: "1 days"
  cache:
    paths:
      - vendor/
  tags:
    - php-composer
  only:
    # - develop
    - release

