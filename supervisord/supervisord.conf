[program:OnUserCreateQueue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan rabbitmq:consumer OnUserCreate
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stopwaitsecs=60

